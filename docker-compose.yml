# =====================================================================
# Lancer l'image de production en local (sans Kubernetes), pour vérifier le Dockerfile :
#   docker compose up -d --build
#   docker compose exec app php artisan db:seed --force     (première fois)
#   → http://localhost:8000
# APP_KEY : générée par "php artisan key:generate --show"
# =====================================================================
services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_eau
      MYSQL_USER: aquasecure
      MYSQL_PASSWORD: aquasecure
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      retries: 30

  app:
    build:
      context: .
      target: production
    image: aquasecure:local
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8080"
    environment: &env
      APP_KEY: "${APP_KEY:?Definissez APP_KEY (php artisan key:generate --show)}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_LOCALE: fr
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: gestion_eau
      DB_USERNAME: aquasecure
      DB_PASSWORD: aquasecure
      SESSION_DRIVER: database
      CACHE_STORE: database
      MAIL_MAILER: log
      TELEMETRIE_API_KEY: aquasecure-capteurs-2026
    # Les migrations passent avant le démarrage d'Apache
    command: ["sh", "-c", "php artisan migrate --force && apache2-foreground"]
    volumes:
      - stockage:/var/www/html/storage/app

  planificateur:
    image: aquasecure:local
    depends_on:
      - app
    environment: *env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - stockage:/var/www/html/storage/app

volumes:
  mysql-data:
  stockage: