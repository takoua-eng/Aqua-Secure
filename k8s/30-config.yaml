# =====================================================================
# Configuration non secrète d'AquaSecure (équivalent du fichier .env)
# Les mots de passe et clés sont dans le Secret "aquasecure-secrets".
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: aquasecure-config
  namespace: aquasecure
data:
  APP_NAME: "AquaSecure"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://aquasecure.local:30080"
  APP_LOCALE: "fr"
  APP_FALLBACK_LOCALE: "en"

  # Journaux envoyés vers la sortie standard : lisibles avec "kubectl logs"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "info"

  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "gestion_eau"
  DB_USERNAME: "aquasecure"

  SESSION_DRIVER: "database"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "sync"
  FILESYSTEM_DISK: "local"

  MAIL_MAILER: "smtp"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_FROM_NAME: "AquaSecure"

  ANTHROPIC_MODEL: "claude-opus-5-5"