# =====================================================================
# MySQL 8.0 : base gestion_eau de l'application
# Utilisateur "aquasecure" créé automatiquement au premier démarrage.
# Mots de passe : Secret "aquasecure-secrets" (créé à la main, jamais dans Git)
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: aquasecure
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: aquasecure
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          # Sur un volume NFS, l'AIO natif d'InnoDB n'est pas pris en charge
          args: ["--innodb-use-native-aio=0", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports:
            - containerPort: 3306
          env:
            - { name: MYSQL_DATABASE, value: gestion_eau }
            - { name: MYSQL_USER, value: aquasecure }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aquasecure-secrets, key: DB_PASSWORD }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: aquasecure-secrets, key: DB_ROOT_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { memory: 768Mi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: nfs
        resources:
          requests:
            storage: 3Gi