; Réglages PHP d'AquaSecure en production
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 120          ; analyses IA et rapports PDF
expose_php = Off

; OPcache : le code PHP compilé est gardé en mémoire (le code ne change pas dans une image)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0