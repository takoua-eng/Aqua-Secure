# Analyse SonarQube d'AquaSecure (lue par sonar-scanner dans le Jenkinsfile)
sonar.projectKey=aquasecure
sonar.projectName=AquaSecure - Gestion des réseaux d'eau
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Code de l'application (PHP + vues Blade/JS) et tests
sonar.sources=app,routes,config,database,resources/views
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/**,node_modules/**

# Résultats des tests et couverture produits par PHPUnit dans Jenkins
sonar.php.tests.reportPath=junit.xml
sonar.php.coverage.reportPaths=coverage.xml
# Couverture : on ne mesure que le code applicatif testable par PHPUnit.
# Migrations, seeders, configuration, routes et vues Blade restent analysés (bugs, sécurité),
# mais ne comptent pas dans le pourcentage de couverture.
sonar.coverage.exclusions=database/**,config/**,routes/**,resources/views/**